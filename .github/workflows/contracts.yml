name: Contracts
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      # Optional repository secret. Without it the Arc testnet fork tests skip themselves.
      ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # Installs the pinned dependencies and checks them against soldeer.lock.
      - run: forge soldeer install
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: forge test --no-match-path 'test/fork/*'
      - name: Arc testnet fork tests
        if: env.ARC_TESTNET_RPC_URL != ''
        run: forge test --match-path 'test/fork/*'
      - name: Coverage
        run: forge coverage --ir-minimum --report summary --no-match-coverage '(test|script|dependencies)/' --no-match-path 'test/fork/*'
