name: Contracts
on:
  push:
    paths:
      - 'contracts/**'
      - 'packages/settlement/src/abi/**'
      - 'packages/settlement/test/fixtures/**'
      - 'tools/settlement-bindings.ts'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'packages/settlement/src/abi/**'
      - 'packages/settlement/test/fixtures/**'
      - 'tools/settlement-bindings.ts'
      - '.github/workflows/contracts.yml'
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      # Optional repository secret. Without it the Arc testnet fork tests skip themselves.
      ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
      # Optional too: read-only checks of Base mainnet's escrow bytecode and USDC domain. Nothing is sent.
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # Installs the pinned dependencies and checks them against soldeer.lock.
      - run: forge soldeer install
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        run: forge test --no-match-path 'test/fork/*'
      - name: Arc testnet fork tests
        if: env.ARC_TESTNET_RPC_URL != ''
        run: forge test --match-path 'test/fork/ArcTestnet.fork.t.sol'
      - name: Base mainnet fork tests (read-only)
        if: env.BASE_MAINNET_RPC_URL != ''
        run: forge test --match-path 'test/fork/BaseMainnet.fork.t.sol'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Regenerates packages/settlement's ABI bindings and test vectors from this build and fails on any difference.
      - name: Settlement bindings and vectors match the build
        working-directory: .
        run: bun install --frozen-lockfile && bun tools/settlement-bindings.ts --check
      - name: Coverage
        run: forge coverage --ir-minimum --report summary --no-match-coverage '(test|script|dependencies)/' --no-match-path 'test/fork/*'
