# Sidequest contracts. See README.md for the design, the pinned dependencies and how to run the tests.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
# The compiler, EVM version and optimizer settings are the ones commerce-payments v1.1.0 used for
# the deployed AuthCaptureEscrow (its `deploy` profile; the bytecode metadata says solc 0.8.28),
# so the locally built escrow in the tests is the deployed one.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100000
via_ir = true
auto_detect_solc = false
auto_detect_remappings = false
# The escrow is compiled against the OpenZeppelin release it was audited and deployed with;
# SidequestOperator and the tests use the current OpenZeppelin release.
remappings = [
  "dependencies/commerce-payments-1.1.0/:@openzeppelin/contracts/=dependencies/openzeppelin-contracts-commerce-5.0.2/contracts/",
  "@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.7.0/contracts/",
  "commerce-payments/=dependencies/commerce-payments-1.1.0/",
  "solady/=dependencies/solady-0.1.1/src/",
  "forge-std/=dependencies/forge-std-1.17.0/src/",
]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 1024
seed = "0x5eed"

[profile.default.invariant]
runs = 256
depth = 64
# The handler catches every expected revert itself, so any revert that escapes is a handler bug.
fail_on_revert = true

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 96

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[soldeer]
remappings_generate = false
remappings_regenerate = false
recursive_deps = false

[dependencies]
commerce-payments = { version = "1.1.0", url = "https://codeload.github.com/base/commerce-payments/zip/6b0a5ef3f0df973857f558e2d6b5dd645b5e97f9" }
openzeppelin-contracts-commerce = { version = "5.0.2", url = "https://codeload.github.com/OpenZeppelin/openzeppelin-contracts/zip/1edc2ae004974ebf053f4eba26b45469937b9381" }
solady = { version = "0.1.1", url = "https://codeload.github.com/Vectorized/solady/zip/5ea5d9f57ed6d24a27d00934f4a3448def931415" }
openzeppelin-contracts = { version = "5.7.0", url = "https://codeload.github.com/OpenZeppelin/openzeppelin-contracts/zip/cab19933c33c2ad1d4c7a84864a3601dddfd16f3" }
forge-std = { version = "1.17.0", url = "https://codeload.github.com/foundry-rs/forge-std/zip/f3dae6e6ee381f25eb6a246f7da9b85c91a68219" }

[lint]
# Every rule here is a deadline: block timestamps are the specification, and validators can skew them by seconds,
# against windows of hours.
exclude_lints = ["block-timestamp"]
